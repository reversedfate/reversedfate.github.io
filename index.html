<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My experiments</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #ffffff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas#bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        header {
            margin-top: 3rem;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 3rem;
        }
        header p {
            margin: 0.5rem 0 0;
            color: #64ffda;
        }
        main {
            width: 100%;
            max-width: 700px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        ul.links {
            list-style: none;
            padding: 0;
        }
        ul.links li {
            margin: 1rem 0;
            padding: 1rem 1.5rem;
            background: rgba(255,255,255,0.07);
            border-radius: 10px;
            backdrop-filter: blur(6px);
            transition: background 0.3s;
        }
        ul.links li:hover {
            background: rgba(255,255,255,0.15);
        }
        a {
            color: #64ffda;
            text-decoration: none;
            font-size: 1.2rem;
            display: block;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <canvas id="bg"></canvas>
    <header>
        <h1>My Experiments</h1>
        <p>A collection of little tools</p>
    </header>
    <main>
        <ul class="links">
            <li><a href="civ6-tools/draft-pick/">Civilization 6 Draft Picker</a></li>
            <li><a href="personal-tools/100-men-vs-animal/">100 Men vs Animal Arena</a></li>
            <li><a href="twilight-imperium-tools/thinking-timer/">Twilight Imperium Thinking Timer</a></li>
        </ul>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('bg');
            const ctx = canvas.getContext('2d');

            let width, height;
            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const particles = [];
            const COUNT = 70;
            for (let i = 0; i < COUNT; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 3 + 1
                });
            }

            const mouse = { x: null, y: null };
            window.addEventListener('mousemove', e => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener('mouseleave', () => {
                mouse.x = null;
                mouse.y = null;
            });

            function draw() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.7)';
                    ctx.fill();
                });

                if (mouse.x !== null) {
                    ctx.beginPath();
                    ctx.arc(mouse.x, mouse.y, 100, 0, Math.PI * 2);
                    const grad = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 100);
                    grad.addColorStop(0, 'rgba(100,255,218,0.3)');
                    grad.addColorStop(1, 'rgba(100,255,218,0)');
                    ctx.fillStyle = grad;
                    ctx.fill();
                }

                requestAnimationFrame(draw);
            }
            draw();
        });
    </script>
</body>
</html>
